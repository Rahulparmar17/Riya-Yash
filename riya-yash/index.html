const stamens=Array.from({length:8},(_,i)=>`<circle cx="${(100+8*Math.cos(i*Math.PI/4)).toFixed(1)}" cy="${(100+8*Math.sin(i*Math.PI/4)).toFixed(1)}" r="2.3" fill="#d9772a"/>`).join("");
const veins=Array.from({length:6},(_,i)=>`<path d="M100 100L100 60" stroke="#b83a68" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" transform="rotate(${i*60} 100 100)"/>`).join("");
document.body.insertAdjacentHTML("afterbegin",`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="gp" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="95"><stop offset="0" stop-color="#c8416f"/><stop offset=".45" stop-color="#ea7fa3"/><stop offset="1" stop-color="#f9c3d3"/></radialGradient>
<radialGradient id="gw" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="100"><stop offset="0" stop-color="#dccbb8"/><stop offset=".3" stop-color="#efe4d8"/><stop offset=".65" stop-color="#fffdf9"/><stop offset="1" stop-color="#fff"/></radialGradient>
<radialGradient id="gc" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffd84d"/><stop offset=".6" stop-color="#f1a92b"/><stop offset="1" stop-color="#cf7f1b"/></radialGradient>
<symbol id="daisy" viewBox="0 0 200 200">${pet(15,15,44,52,"url(#gw)","#e4d6c8")}${pet(15,14,40,56,"#fffefb","#eadfd3",12)}<circle cx="100" cy="100" r="27" fill="url(#gc)" stroke="#c9801a" stroke-width="2"/><circle cx="100" cy="100" r="15" fill="none" stroke="#b9701a" stroke-width="2.2" stroke-dasharray="2 4"/></symbol>
<symbol id="pk" viewBox="0 0 200 200">${pet(6,31,50,50,"url(#gp)","#d9628d")}${veins}<circle cx="100" cy="100" r="15" fill="#f6c95c" stroke="#d98d2b" stroke-width="2"/>${stamens}</symbol>
</defs></svg>`);
const fl=(t,c="",r=0)=>`<svg class="fl ${t} ${c}" viewBox="0 0 200 200" style="--r:${r}deg" aria-hidden="true"><use href="#${t}"/></svg>`;
const hero=document.getElementById("hero");
hero.insertAdjacentHTML("afterbegin",fl("daisy","a",-8)+fl("daisy","c",14)+fl("pk","d",-6));
hero.querySelector(".card").insertAdjacentHTML("beforeend",fl("pk","b",8));

const $=document.getElementById("app");
const miss=f=>`<div class="ph">📷 ${f}<br><small>is file ko assets/ folder me daalo</small></div>`;
window.fail=(el,f)=>{el.outerHTML=miss(f)};
let n=0;
function med(f,cap){
  const v=/\.mp4$/i.test(f);
  const t=v?`<video src="${A+f}" controls playsinline preload="metadata" onerror="fail(this,'${f}')"></video>`
          :`<img src="${A+f}" alt="${f}" loading="lazy" onerror="fail(this,'${f}')">`;
  const k=n++%3,d=k===0?fl("daisy","",-12):k===1?fl("pk","",10):"";
  return `<div class="m" ${cap?`data-cap="${cap}"`:""}>${t}${d}</div>`;
}
const paras=a=>a.map(t=>`<p>${t}</p>`).join("");
const T='<div class="tear"></div>';
let h="";
chapters.forEach((c,i)=>{
  const fls=i%2?fl("pk","tr",8)+fl("daisy","bl",-10):fl("daisy","tl",-10)+fl("pk","br",8);
  h+=`<section class="${c.cls} story rv">${fls}<span class="date">${c.date}</span><h2>${c.title}</h2><div class="csub">${c.sub}</div>${paras(c.text)}${c.extra||""}<div class="media">${c.media.map((f,i)=>med(f,c.caps&&c.caps[i])).join("")}</div></section>${T}`;
});
h+=`<section class="gal">${fl("daisy","tl",-10)}${fl("pk","br",8)}<div class="rv"><span class="date">The memories that made us US.</span><h2>Little Things, Big Memories</h2></div>`+
 memories.map(m=>`<div class="mem rv"><h3>${m[1]}</h3><p style="max-width:44ch">${m[2]}</p><div class="media">${m[3].map(f=>med(f)).join("")}</div></div>`).join("")+`</section>`;
//h+=`<section class="film">${fl("pk","tr",8)}<div class="story rv"><span class="date">Two people. One story. A lifetime to go.</span><h2>Our Pre-Wedding Film</h2>${paras(film.text)}</div><div class="media rv" style="max-width:900px">${med(film.video)}</div><div class="stills rv">${film.stills.map(f=>med(f)).join("")}${med(film.clip)}</div></section>`;
h+=`<section class="wed">${fl("daisy","tr",10)}${fl("pk","bl",-8)}<div class="story rv"><span class="date">The Wedding Chapter</span><h2>And Now... Our Forever Begins</h2>${paras(wedding.text)}</div>
<div class="cd rv" id="cd"></div><p class="edit rv" contenteditable>3 December 2026 · ${WEDDING_VENUE}</p><div class="media rv" style="max-width:700px;margin-inline:auto">${med(wedding.photo)}</div></section>`;
h+=`<section class="env">${fl("daisy","tl",-10)}${fl("pk","tr",8)}<span class="date">One last thing, Jana... 💌</span><h2>A Letter From Your Bebu</h2><div id="envelope"><div class="flap"></div><div class="seal">❤️</div></div><div class="tap" id="tap">envelope kholo ↑</div><div id="letter">${fl("pk","",8)}${fl("daisy","",-10)}${letter.map(l=>`<p>${l}</p>`).join("")}</div></section>
<div class="final"><div class="bg"><img src="${A+FINAL_PHOTO}" alt="" onerror="this.outerHTML='<div class=ph>📷 ${FINAL_PHOTO}</div>'"></div>${fl("daisy","fa",-8)}${fl("pk","fb",12)}<div class="txt"><p>And this is just the beginning of forever...</p><div class="heart">♥</div><p style="font-size:clamp(3rem,10vw,5rem)">Riya ♡ Yash</p></div></div>`;
$.innerHTML=h;

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));

function tick(){const d=new Date(WEDDING_DATE)-new Date();const cd=document.getElementById("cd");
 if(d<=0){cd.innerHTML="<div><b>♥</b>Aaj hamari shaadi hai!</div>";return}
 const u=[["din",864e5],["ghante",36e5],["min",6e4],["sec",1e3]];let r=d;
 cd.innerHTML=u.map(([n,m])=>{const v=Math.floor(r/m);r%=m;return `<div><b>${v}</b>${n}</div>`}).join("")}
tick();setInterval(tick,1000);

const env=document.getElementById("envelope");
env.onclick=()=>{if(env.classList.contains("open"))return;env.classList.add("open");document.getElementById("tap").remove();
 setTimeout(()=>{const L=document.getElementById("letter");L.style.display="block";L.scrollIntoView({behavior:"smooth",block:"center"});
  L.querySelectorAll("p").forEach((p,i)=>setTimeout(()=>p.classList.add("in"),600+i*1400))},900)};
/* AUTO-FIX: assets ke asli naam khud dhundh leta hai */
const stem=n=>n.split('.')[0].toLowerCase();
const files={};
const ready=(async()=>{
 try{
  const user=location.hostname.split('.')[0];
  const p=location.pathname.split('/').filter(x=>x&&!/\.html?$/i.test(x));
  const dir=p.slice(1).join('/');
  const r=await fetch(`https://api.github.com/repos/${user}/${p[0]}/contents/${dir?dir+'/':''}assets`);
  (await r.json()).forEach(x=>files[stem(x.name)]=x.name);
 }catch(e){}
})();
window.fail=async(el,f)=>{
 await ready;
 const real=files[stem(f)];
 if(!real){el.outerHTML=miss(f);return}
 const s=A+encodeURIComponent(real),v=/\.(mp4|mov|webm)$/i.test(real);
 el.outerHTML=v?`<video src="${s}" controls playsinline preload="metadata"></video>`:`<img src="${s}" alt="" loading="lazy">`;
};
setTimeout(()=>{const ph=document.querySelector('.final .bg .ph'),real=files[stem(FINAL_PHOTO)];
 if(ph&&real)ph.outerHTML=`<img src="${A+encodeURIComponent(real)}" alt="">`},2000);
</script>
</body>
</html>
